name: Release Check

# 手动触发的发布预检：在真实发布 runner（arm64 macos-14 / windows-2022）上跑
# 完整的 tauri build，提前暴露交叉编译/依赖环境问题，不创建 Release、不打 tag。
#
# 为什么存在：发布环境错误（如 macOS arm64→x86_64 交叉编译的 libjpeg 架构、
# libheif 的 pkg-config 检测）本地 x86_64 Mac 无法复现，只能等真实 runner。
# 以前要"打 tag → 等全量构建 → 失败 → 改 → 再打 tag"，每轮 30 分钟+。
# 现在改完环境相关问题后，先在这里手动跑一次验证（可只跑受影响平台），
# 通过后再打 tag 正式发布。
#
# 用法：Actions → Release Check → Run workflow → 选 macos / windows / both
on:
  workflow_dispatch:
    inputs:
      jobs:
        description: 要检查的平台
        required: true
        default: both
        type: choice
        options: [both, macos, windows]

jobs:
  macos:
    if: ${{ inputs.jobs != 'windows' }}
    runs-on: macos-14
    env:
      LIBREOFFICE_ARCH: x86-64
      PKG_CONFIG_ALLOW_CROSS: "1"
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Add Intel macOS target
        run: rustup target add x86_64-apple-darwin
      - run: npm ci
      - run: bash ../scripts/prepare-libreoffice.sh
      # 与 release.yml 保持一致：交叉编译 x86_64 静态 libjpeg 供 libheif 链接。
      - name: Build x86_64 libjpeg for cross-compile
        shell: bash
        run: |
          curl -fsSL -o /tmp/lj.tar.gz \
            "https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/3.0.0/libjpeg-turbo-3.0.0.tar.gz"
          tar xzf /tmp/lj.tar.gz -C /tmp
          cmake -S /tmp/libjpeg-turbo-3.0.0 -B /tmp/jpeg-build \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_INSTALL_PREFIX=/tmp/jpeg-out \
            -DENABLE_SHARED=OFF -DENABLE_STATIC=ON \
            -DWITH_TURBOJPEG=OFF
          cmake --build /tmp/jpeg-build --target install -j 3
          echo "CMAKE_PREFIX_PATH=/tmp/jpeg-out" >> "$GITHUB_ENV"
      - name: Build Intel (x86_64) bundle
        run: |
          echo "PKG_CONFIG_PATH=/tmp/jpeg-out/lib/pkgconfig" >> "$GITHUB_ENV"
          test -f /tmp/jpeg-out/lib/pkgconfig/libjpeg.pc
          cargo clean --manifest-path ../src-tauri/Cargo.toml -p libheif-sys
          npm run tauri build -- --target x86_64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: release-check-macos-dmg
          path: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  windows:
    if: ${{ inputs.jobs != 'macos' }}
    runs-on: windows-2022
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: bash ../scripts/prepare-libreoffice.sh
      - name: Install libheif via vcpkg
        run: |
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV
          echo "VCPKGRS_TRIPLET=x64-windows-static-md" >> $env:GITHUB_ENV
          vcpkg install libheif:x64-windows-static-md
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: release-check-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
