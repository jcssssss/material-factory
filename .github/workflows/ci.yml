name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            cmake \
            nasm \
            libde265-dev \
            libx265-dev \
            libjpeg-dev \
            libpng-dev \
            pkg-config
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Create vendor/libreoffice placeholder
        run: mkdir -p vendor/libreoffice
      - name: Run cargo test
        working-directory: src-tauri
        run: |
          set +e
          cargo test 2>&1 | tee /tmp/cargo_test.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            grep -E "error\[|error:|could not compile|cannot find|undefined reference|FAILED" /tmp/cargo_test.log \
              | head -25 | while IFS= read -r line; do
                echo "::error::$line"
              done
            exit $status
          fi
