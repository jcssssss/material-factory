name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    env:
      # 仅构建 Intel Mac 包，需捆绑 x86-64 版 LibreOffice（runner 是 arm64）
      LIBREOFFICE_ARCH: x86-64
      # 交叉编译（arm64→x86_64）时 libheif 的 pkg-config 交叉检查需显式放行
      PKG_CONFIG_ALLOW_CROSS: "1"
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Add Intel macOS target
        run: rustup target add x86_64-apple-darwin
      - run: npm ci
      - run: bash ../scripts/prepare-libreoffice.sh
      # arm64 runner 交叉编译 x86_64 时，libheif 链接到 /opt/homebrew 的 arm64 libjpeg，
      # 架构不匹配导致链接失败。这里交叉编译一个 x86_64 静态 libjpeg 供其链接；
      # CMAKE_PREFIX_PATH 会被 cmake crate 传给 libheif 的 CMake，find_package(JPEG) 优先命中它。
      - name: Build x86_64 libjpeg for cross-compile
        shell: bash
        run: |
          curl -fsSL -o /tmp/lj.tar.gz \
            "https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/3.0.0/libjpeg-turbo-3.0.0.tar.gz"
          tar xzf /tmp/lj.tar.gz -C /tmp
          cmake -S /tmp/libjpeg-turbo-3.0.0 -B /tmp/jpeg-build \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_INSTALL_PREFIX=/tmp/jpeg-out \
            -DENABLE_SHARED=OFF -DENABLE_STATIC=ON \
            -DWITH_TURBOJPEG=OFF
          cmake --build /tmp/jpeg-build --target install -j 3
          echo "CMAKE_PREFIX_PATH=/tmp/jpeg-out" >> "$GITHUB_ENV"
      - name: Build Intel (x86_64) bundle
        run: |
          # 强制 libheif-sys 用当前 env 重新编译：setup-rust-toolchain 的 SWC 缓存会复用上次失败 run
          # 的产物（无 CMAKE_PREFIX_PATH，链接 /opt/homebrew 的 arm64 libjpeg），clean 后重跑 build script
          # 才会按 CMAKE_PREFIX_PATH 找到 x86_64 libjpeg。
          cargo clean --manifest-path ../src-tauri/Cargo.toml -p libheif-sys
          npm run tauri build -- --target x86_64-apple-darwin
      - uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          generate_release_notes: true

  windows:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - run: npm ci
      - run: bash ../scripts/prepare-libreoffice.sh
      # libheif-sys 在 msvc 下走 vcpkg 找系统 libheif，需先安装（embedded-libheif 仅对非 msvc 生效）
      - name: Install libheif via vcpkg
        run: |
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV
          vcpkg install libheif:x64-windows
      - run: npm run tauri build
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
