name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    env:
      # 仅构建 Intel Mac 包，需捆绑 x86-64 版 LibreOffice（runner 是 arm64）
      LIBREOFFICE_ARCH: x86-64
      # 交叉编译（arm64→x86_64）时 libheif 的 pkg-config 交叉检查需显式放行
      PKG_CONFIG_ALLOW_CROSS: "1"
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      # Cargo 构建缓存：几百个依赖 crate 只编一次，后续 run 增量恢复，
      # 把全量编译时间从 ~30 分钟降到几分钟。libheif-sys 因 build script 依赖
      # env（CMAKE_PREFIX_PATH/PKG_CONFIG_PATH）且无 rerun-if-env-changed，
      # 靠下方 Build 步骤的 `cargo clean -p libheif-sys` 兜底强制重编。
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Add Intel macOS target
        run: rustup target add x86_64-apple-darwin
      - run: npm ci
      - run: bash ../scripts/prepare-libreoffice.sh
      # arm64 runner 交叉编译 x86_64 时，libheif 链接到 /opt/homebrew 的 arm64 libjpeg，
      # 架构不匹配导致链接失败。这里交叉编译一个 x86_64 静态 libjpeg 供其链接；
      # CMAKE_PREFIX_PATH 会被 cmake crate 传给 libheif 的 CMake，find_package(JPEG) 优先命中它。
      - name: Build x86_64 libjpeg for cross-compile
        shell: bash
        run: |
          curl -fsSL -o /tmp/lj.tar.gz \
            "https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/3.0.0/libjpeg-turbo-3.0.0.tar.gz"
          tar xzf /tmp/lj.tar.gz -C /tmp
          cmake -S /tmp/libjpeg-turbo-3.0.0 -B /tmp/jpeg-build \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_INSTALL_PREFIX=/tmp/jpeg-out \
            -DENABLE_SHARED=OFF -DENABLE_STATIC=ON \
            -DWITH_TURBOJPEG=OFF
          cmake --build /tmp/jpeg-build --target install -j 3
          echo "CMAKE_PREFIX_PATH=/tmp/jpeg-out" >> "$GITHUB_ENV"
      - name: Build Intel (x86_64) bundle
        # 用 step 级 env 而非 GITHUB_ENV：后者写入的变量只对"下一个" step 生效，
        # 当前 step 的 shell 不会重新读取，导致 pkg-config 仍命中 /opt/homebrew 的 arm64 libjpeg。
        env:
          PKG_CONFIG_PATH: /tmp/jpeg-out/lib/pkgconfig
        run: |
          # libheif 用 pkg-config 检测 libjpeg（pkg_check_modules(JPEG libjpeg)，非 find_package），
          # 所以 CMAKE_PREFIX_PATH 对它无效；把 x86_64 libjpeg 的 pc 目录放进 PKG_CONFIG_PATH
          # 后 pkg-config 优先命中它，否则链接到 /opt/homebrew 的 arm64 libjpeg
          # （ld: symbol(s) not found for architecture x86_64）。
          test -f /tmp/jpeg-out/lib/pkgconfig/libjpeg.pc
          echo "libjpeg prefix -> $(pkg-config --variable=prefix libjpeg)"
          # 强制 libheif-sys 重编译，确保上述 env 生效（否则复用旧 env 的缓存产物）。
          cargo clean --manifest-path ../src-tauri/Cargo.toml -p libheif-sys
          npm run tauri build -- --target x86_64-apple-darwin
      - uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          generate_release_notes: true

  windows:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: bash ../scripts/prepare-libreoffice.sh
      # libheif-sys 在 msvc 下走 vcpkg 找系统 libheif，需先安装（embedded-libheif 仅对非 msvc 生效）。
      # 注意 triplet 必须与 vcpkg crate 的默认值一致（x64-windows-static-md），否则 find_package 找不到。
      - name: Install libheif via vcpkg
        run: |
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV
          echo "VCPKGRS_TRIPLET=x64-windows-static-md" >> $env:GITHUB_ENV
          vcpkg install libheif:x64-windows-static-md
      - run: npm run tauri build
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
