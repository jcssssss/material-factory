name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    env:
      # 仅构建 Intel Mac 包，需捆绑 x86-64 版 LibreOffice（runner 是 arm64）
      LIBREOFFICE_ARCH: x86-64
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Add Intel macOS target
        run: rustup target add x86_64-apple-darwin
      - run: npm ci
      - run: bash ../scripts/prepare-libreoffice.sh
      - name: Build Intel (x86_64) bundle
        run: npm run tauri build -- --target x86_64-apple-darwin
      - uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          generate_release_notes: true

  windows:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - run: npm ci
      - run: bash ../scripts/prepare-libreoffice.sh
      - run: npm run tauri build
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
