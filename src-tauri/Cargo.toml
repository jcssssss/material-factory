[package]
name = "xhs-pic"
version = "0.1.0"
description = "小红书素材工厂 - 桌面批量 PDF 转小红书素材"
authors = ["xhs-pic"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "xhs_pic_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
image = { version = "0.24", default-features = false, features = ["jpeg", "png"] }
rayon = "1"
num_cpus = "1"
lopdf = "0.34"
libheif-rs = { version = "2.3.0", features = ["embedded-libheif"] }

[profile.dev]
# 开发模式：多 codegen units 加速编译，牺牲少量运行时性能
codegen-units = 256

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
# 从 opt-level="s"（优化体积）改为 3（优化速度）：warp 双线性插值等内层
# 循环受益于向量化与内联，预期提升 10~30%；代价是二进制体积与编译时间小幅增加。
opt-level = 3
strip = true
