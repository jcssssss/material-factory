[package]
name = "xhs-pic"
version = "0.1.0"
description = "小红书素材工厂 - 桌面批量 PDF 转小红书素材"
authors = ["xhs-pic"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "xhs_pic_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
image = { version = "0.24", default-features = false, features = ["jpeg", "png"] }

[profile.dev]
# 开发模式：多 codegen units 加速编译，牺牲少量运行时性能
codegen-units = 256

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
