<?xml version="1.0" encoding="UTF-8"?>
<!-- 方案 E5：强光环版（Bright Rings）
     在 E4 基础上强化光环：
       - 光环外径放大：300×96 → 360×115（占画布 70%）
       - 描边加粗：2.5 → 3.5（品红）、2 → 3（青色）
       - 不透明度：0.85 → 1.0
       - 新增第 3 层紫色内环（增强层次）
       - 发光滤镜加强：stdDeviation 5/14
       - 中心底色发光相应放大
     中心图片卡片保持 180×180（35%）
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1F1A3E"/>
      <stop offset="60%" stop-color="#0F0A2A"/>
      <stop offset="100%" stop-color="#050514"/>
    </radialGradient>
    <linearGradient id="coreImgBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF4E6"/>
      <stop offset="100%" stop-color="#FFD0A0"/>
    </linearGradient>
    <!-- 强霓虹发光 -->
    <filter id="neonGlowStrong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur1"/>
      <feGaussianBlur stdDeviation="14" result="blur2"/>
      <feGaussianBlur stdDeviation="28" result="blur3"/>
      <feMerge>
        <feMergeNode in="blur3"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur1"/>
      <feGaussianBlur stdDeviation="32" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur1"/>
      <feGaussianBlur stdDeviation="13" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 深色背景 -->
  <rect x="56" y="56" width="400" height="400" rx="88" ry="88" fill="url(#bgGrad)"/>

  <!-- 中心底色发光（粉+青叠加，放大） -->
  <circle cx="256" cy="256" r="170" fill="#FF00AA" opacity="0.28" filter="url(#strongGlow)"/>
  <circle cx="256" cy="256" r="130" fill="#00E5FF" opacity="0.32" filter="url(#strongGlow)"/>

  <!-- 外层光环：品红，倾角 -25 度（外径 360×115，占画布 70%） -->
  <ellipse cx="256" cy="256" rx="180" ry="58" fill="none" stroke="#FF00AA" stroke-width="3.5" opacity="1.0" transform="rotate(-25 256 256)" filter="url(#neonGlowStrong)"/>
  <!-- 中层光环：青色，倾角 35 度（外径 330×105） -->
  <ellipse cx="256" cy="256" rx="165" ry="52" fill="none" stroke="#00E5FF" stroke-width="3" opacity="1.0" transform="rotate(35 256 256)" filter="url(#neonGlowStrong)"/>
  <!-- 内层光环：紫色，倾角 0 度（外径 280×88） -->
  <ellipse cx="256" cy="256" rx="140" ry="44" fill="none" stroke="#9D00FF" stroke-width="2.5" opacity="0.95" filter="url(#neonGlowStrong)"/>

  <!-- 中心核心图片卡片（180×180，占画布 35%） -->
  <g filter="url(#coreGlow)">
    <!-- 卡片主体（白色，圆角） -->
    <rect x="166" y="166" width="180" height="180" rx="24" ry="24" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2.5"/>
    <!-- 图片区域 -->
    <rect x="184" y="184" width="144" height="96" rx="9" ry="9" fill="url(#coreImgBg)"/>
    <!-- 山形 -->
    <path d="M 193 280 L 224 248 L 244 266 L 274 236 L 312 280 Z" fill="#FF00AA"/>
    <!-- 太阳 -->
    <circle cx="298" cy="208" r="12" fill="#FFEB3B"/>
    <!-- 底部内容行 -->
    <rect x="184" y="294" width="72" height="5" rx="2.5" fill="#FF00AA" opacity="0.5"/>
    <rect x="184" y="306" width="108" height="5" rx="2.5" fill="#FF00AA" opacity="0.4"/>
    <rect x="184" y="318" width="84" height="5" rx="2.5" fill="#FF00AA" opacity="0.4"/>
  </g>
</svg>
